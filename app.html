<title>SparkLab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one phone-width column (max 560px) with a sticky top bar and a fixed bottom nav; lessons take over the column. */
:root{
  --bg:#eef3f8; --card:#ffffff; --ink:#1b2838; --muted:#5a6a7e; --line:#d6e0ea;
  --orange:#ff7a2f; --orange-d:#d85f17; --teal:#0fa38f; --teal-d:#0a7d6d; --teal-soft:#dff5f1;
  --sun:#ffc83d; --berry:#e5484d; --berry-soft:#fde8e8; --navy:#24364d; --locked:#c5d0dc;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;gap:10px;padding-block:12px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.01em;margin-right:auto}
.brand b{color:var(--orange)}
.pill{display:flex;align-items:center;gap:5px;font-weight:600;font-size:15px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:4px 11px;font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}
.iconbtn{background:var(--card);border:2px solid var(--line);border-radius:12px;width:40px;height:40px;display:grid;place-items:center;padding:0}
.iconbtn svg{width:20px;height:20px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:2px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.nav-in{max-width:560px;margin:0 auto;display:flex}
.nav button{flex:1;background:none;border:0;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:600;color:var(--muted)}
.nav button svg{width:26px;height:26px}
.nav button[aria-current="true"]{color:var(--orange)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:14px 20px;font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:.02em;background:var(--orange);color:#fff;box-shadow:0 4px 0 var(--orange-d);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--orange-d)}
.btn[disabled]{background:var(--locked);box-shadow:0 4px 0 #a9b6c4;cursor:not-allowed}
.btn.teal{background:var(--teal);box-shadow:0 4px 0 var(--teal-d)}
.btn.berry{background:var(--berry);box-shadow:0 4px 0 #b3343a}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.small{font-size:16px;padding:10px 14px;border-radius:12px}
.btn.wide{width:100%}

/* course map */
.hero{background:var(--navy);color:#fff;border-radius:22px;padding:18px;display:flex;gap:14px;align-items:center;margin-top:4px}
.hero .mascot{width:76px;height:76px;flex:none}
.hero h1{font-size:24px}
.hero p{color:#c8d6e6;font-size:14px;margin-top:2px}
.unit{margin-top:22px;border-radius:20px;background:var(--orange);color:#fff;padding:14px 16px;box-shadow:0 4px 0 var(--orange-d)}
.unit small{display:block;text-transform:uppercase;letter-spacing:.08em;font-size:12px;font-weight:600;opacity:.9}
.unit h2{font-size:23px}
.unit p{font-size:14px;opacity:.95}
.path{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:26px 10px}
.node{position:relative;width:76px;height:76px;border-radius:50%;border:0;display:grid;place-items:center;background:var(--teal);box-shadow:0 6px 0 var(--teal-d);color:#fff}
.node svg{width:34px;height:34px}
.node.todo{background:var(--card);color:var(--muted);box-shadow:0 6px 0 var(--line);border:3px solid var(--line)}
.node.next{background:var(--orange);box-shadow:0 6px 0 var(--orange-d);color:#fff;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{outline:0 solid rgba(255,122,47,.35)}50%{outline:10px solid rgba(255,122,47,.12)}}
.nodewrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.nodewrap .lbl{font-weight:600;font-size:14px;text-align:center;max-width:170px}
.nodewrap .xp{font-size:12px;color:var(--muted)}
.bubble{position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--orange);border:2px solid var(--line);font-family:var(--display);font-weight:800;font-size:14px;padding:1px 10px;border-radius:10px;white-space:nowrap;letter-spacing:.06em}
.soon-h{margin-top:20px;font-size:20px}
.soon-sub{color:var(--muted);font-size:14px;margin-top:2px}
.soon{display:grid;gap:10px;margin-top:12px}
.soon .c{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.soon .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--bg);color:var(--muted)}
.soon .ic svg{width:24px;height:24px}
.soon h3{font-size:17px}
.soon p{font-size:13.5px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;background:var(--bg);color:var(--muted);border-radius:6px;padding:1px 7px;margin-left:6px;vertical-align:2px}

/* lesson */
.lesson{display:flex;flex-direction:column;min-height:calc(100vh - 120px)}
.lhead{display:flex;align-items:center;gap:12px;padding-block:14px}
.bar{flex:1;height:16px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);border-radius:99px;transition:width .35s}
.lbody{flex:1;display:flex;flex-direction:column;gap:16px;padding-bottom:20px}
.kicker{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--orange)}
.lbody h2{font-size:26px}
.lbody .txt{font-size:16.5px;max-width:62ch}
.lbody .txt b{color:var(--navy)}
.say{display:flex;gap:10px;align-items:flex-start}
.say .mascot{width:56px;height:56px;flex:none}
.say .sp{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;font-size:15.5px;position:relative;min-width:0}
.art{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;display:grid;place-items:center}
.art svg{width:100%;max-width:340px;height:auto}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 14px;font-size:16px;line-height:1.35}
.opt[aria-pressed="true"]{border-color:#7cc7f0;background:#eaf6fd}
.opt.right{border-color:var(--teal);background:var(--teal-soft)}
.opt.wrong{border-color:var(--berry);background:var(--berry-soft)}
.lfoot{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.fb{border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:15px}
.fb h3{font-size:20px}
.fb.good{background:var(--teal-soft);color:var(--teal-d)}
.fb.bad{background:var(--berry-soft);color:#a6262b}
.fb p{color:var(--ink)}

/* order */
.slots{display:grid;gap:8px}
.slot{min-height:50px;border:2px dashed var(--line);border-radius:12px;display:flex;align-items:center;gap:10px;padding:6px 10px;color:var(--muted);font-size:14px}
.slot .n{width:26px;height:26px;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;font-weight:600;font-size:13px;flex:none}
.slot button{flex:1;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:7px 10px;font-size:15px}
.slot.right button{border-color:var(--teal);background:var(--teal-soft)}
.slot.wrong button{border-color:var(--berry);background:var(--berry-soft)}
.pool{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:2px solid var(--line);border-bottom-width:4px;border-radius:12px;padding:8px 12px;font-size:15px}
.chip.mini{font-size:13.5px;padding:5px 10px;border-bottom-width:3px}

/* prompt coach */
textarea,input[type=text],input[type=password]{width:100%;font:inherit;font-size:16px;border:2px solid var(--line);border-radius:14px;padding:12px;background:var(--card);color:var(--ink);resize:vertical}
.score{display:flex;gap:6px;align-items:center;font-family:var(--display);font-weight:700;font-size:20px}
.checks{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.checks li{display:flex;gap:8px;align-items:flex-start;font-size:15px}
.checks .d{width:22px;height:22px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff;margin-top:1px}
.checks .y{background:var(--teal)} .checks .n{background:var(--locked)}
.coach{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:14px;display:grid;gap:10px}
.better{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px}
.aistat{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.aistat i{width:8px;height:8px;border-radius:50%;background:var(--locked);display:inline-block}
.aistat.on i{background:var(--teal)}

/* 3d viewer */
.viewer{position:relative;width:100%;max-width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:linear-gradient(#dbe8f4,#f7fafc);border:2px solid var(--line);touch-action:none}
.viewer canvas{display:block;width:100%!important;height:100%!important}
.viewer .hint{position:absolute;left:10px;bottom:8px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.8);padding:2px 8px;border-radius:8px;pointer-events:none}
.viewer .hud{position:absolute;right:10px;top:10px;font-size:13px;font-weight:600;background:rgba(255,255,255,.9);padding:4px 10px;border-radius:10px;font-variant-numeric:tabular-nums}
.specs{display:flex;flex-wrap:wrap;gap:6px}
.spec{font-size:13px;background:var(--card);border:2px solid var(--line);border-radius:10px;padding:3px 9px;font-variant-numeric:tabular-nums}
.row{display:flex;gap:8px}
.row input{flex:1;min-width:0}
.log{display:grid;gap:4px;font-size:14px}
.log div{background:var(--teal-soft);color:var(--teal-d);border-radius:10px;padding:6px 10px}
.log div.warn{background:#fff4d6;color:#8a5a00}

/* slicer */
.sl{display:grid;gap:4px}
.sl label{display:flex;justify-content:space-between;font-weight:600;font-size:15px}
.sl label span{font-variant-numeric:tabular-nums;color:var(--orange)}
input[type=range]{width:100%;accent-color:var(--orange)}
.meters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.meter{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.meter small{display:block;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.meter b{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.meter .mb{height:8px;border-radius:9px;background:var(--line);margin-top:6px;overflow:hidden}
.meter .mb i{display:block;height:100%;background:var(--teal)}
.toggle{display:flex;align-items:center;gap:10px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--orange)}

/* done screen */
.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;padding-top:30px}
.done .mascot{width:130px;height:130px}
.done h2{font-size:32px}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.stat{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:10px 16px;min-width:100px}
.stat small{display:block;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat b{font-family:var(--display);font-size:26px;font-variant-numeric:tabular-nums}
.stat.xp b{color:#c48a00} .stat.st b{color:var(--orange)} .stat.ac b{color:var(--teal)}

/* parent view */
.pv{display:grid;gap:14px;padding-top:4px}
.pv .card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
.pv h1{font-size:28px}
.pv h2{font-size:20px;margin-bottom:8px}
.pv .sub{color:var(--muted);font-size:14.5px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px}
.kpi small{display:block;color:var(--muted);font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.kpi b{font-family:var(--display);font-size:28px;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted)}
.skills{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.skills li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.skills .d{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-weight:700;background:var(--locked);margin-top:1px}
.skills li.got .d{background:var(--teal)}
.skills li:not(.got){color:var(--muted)}
.skills small{display:block;color:var(--muted);font-size:13px}
.week{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:10px}
.week div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);height:100%;justify-content:flex-end}
.week i{display:block;width:100%;max-width:34px;background:var(--teal);border-radius:7px 7px 3px 3px;min-height:3px}
.week i.zero{background:var(--line)}
.starters{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px}
.quote{background:var(--bg);border-radius:12px;padding:10px 12px;font-size:15px;font-style:italic}
.namebox{display:flex;gap:8px;align-items:center;margin-top:8px}
.namebox input{max-width:200px;padding:8px 10px}
.why{display:grid;gap:10px;margin:0;padding:0;list-style:none;font-size:15px}
.why b{display:block;font-family:var(--display);font-size:17px}

/* modal */
.modal{position:fixed;inset:0;z-index:20;background:rgba(27,40,56,.55);display:flex;align-items:flex-end;justify-content:center;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:90vh;overflow:auto}
.sheet h2{font-size:24px}
.sheet .sub{color:var(--muted);font-size:14px}
.center{text-align:center;justify-items:center}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
@media (prefers-reduced-motion:reduce){.node.next{animation:none}*{transition:none!important}}
</style>

<div class="app" id="app"></div>
<nav class="nav" id="nav"><div class="nav-in">
  <button id="nav-learn" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 4l9 6.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Learn</button>
  <button id="nav-parent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="3.2"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M14.5 20c.2-2.6 1.5-4.5 4-4.5 1.8 0 3 1 3.5 2.6"/></svg>Parents</button>
</div></nav>
<canvas id="confetti"></canvas>

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const todayKey = (d = new Date()) => d.toISOString().slice(0, 10);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};

  chat: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9.5h8M8 12.5h5" stroke-linecap="round"/></svg>',
  cube: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M12 2.5 21 7v10l-9 4.5L3 17V7z"/><path d="m3 7 9 4.5L21 7M12 11.5v10"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>',

  function frame() {

    cam.position.set(Math.sin(rotY) * Math.cos(rotX) * d, Math.sin(rotX) * d + ty, Math.cos(rotY) * Math.cos(rotX) * d);

  el.addEventListener("pointermove", e => { if (!dragging) return; rotY -= (e.clientX - last[0]) * 0.01; rotX = clamp(rotX + (e.clientY - last[1]) * 0.006, 0.05, 1.3); last = [e.clientX, e.clientY]; });

function go(v) {

/* ============ lesson engine ============ */
let L = null;
function startLesson(i) {
  destroyViewers(); view = "lesson"; $("#nav").hidden = true;
  L = { i, lesson: LESSONS[i], step: 0, correct: 0, answered: 0, t0: Date.now() };
  renderStep();
}
function renderStep() {
  destroyViewers(); window.scrollTo(0, 0);
  const st = L.lesson.steps[L.step], pct = (L.step / L.lesson.steps.length) * 100;
  app.innerHTML = topBar(true) + `<div class="lesson">
    <div class="lhead"><button class="iconbtn" id="quit" aria-label="Leave lesson">${IC.x}</button><div class="bar"><i style="width:${pct}%"></i></div></div>
    <div class="lbody" id="lbody"></div>
    <div class="lfoot" id="lfoot"></div></div>`;
  $("#quit").onclick = () => go("map");
  const body = $("#lbody"), foot = $("#lfoot");
  STEP[st.t](st, body, foot);
}
function footBtn(foot, label, { disabled = false, cls = "", fb = "" } = {}) {
  foot.innerHTML = fb + `<button class="btn wide ${cls}" id="fbtn" ${disabled ? "disabled" : ""}>${label}</button>`;
  return $("#fbtn", foot);
}
function next() { L.step++; if (L.step >= L.lesson.steps.length) finishLesson(); else renderStep(); }
function feedback(ok, why) {
  return `<div class="fb ${ok ? "good" : "bad"}"><h3>${ok ? ["Nice!", "Correct!", "You got it!", "Maker brain!"][Math.floor(Math.random() * 4)] : "Not quite"}</h3><p>${why}</p></div>`;
}
const STEP = {
  info(st, body, foot) {
    body.innerHTML = `<div class="kicker">${st.kicker}</div><h2>${st.h}</h2>${st.art ? `<div class="art">${ART[st.art]}</div>` : ""}<p class="txt">${st.body}</p>`;
    footBtn(foot, "Continue").onclick = next;
  },
  quiz(st, body, foot) {
    let pick = null;
    body.innerHTML = `${st.art ? `<div class="art">${ART[st.art]}</div>` : ""}<h2>${esc(st.q)}</h2><div class="opts">${st.o.map((o, i) => `<button class="opt" data-i="${i}" aria-pressed="false">${esc(o)}</button>`).join("")}</div>`;
    const btn = footBtn(foot, "Check", { disabled: true });
    body.querySelectorAll(".opt").forEach(b => b.onclick = () => {
      if (btn.dataset.done) return;
      pick = +b.dataset.i; body.querySelectorAll(".opt").forEach(x => x.setAttribute("aria-pressed", x === b)); btn.disabled = false;
    });
    btn.onclick = () => {
      const ok = pick === st.a; L.answered++; if (ok) L.correct++;
      body.querySelectorAll(".opt").forEach((x, i) => { if (i === st.a) x.classList.add("right"); else if (i === pick) x.classList.add("wrong"); });
      const b2 = footBtn(foot, "Continue", { cls: ok ? "teal" : "berry", fb: feedback(ok, esc(st.why)) }); b2.dataset.done = 1;
      body.querySelectorAll(".opt").forEach(x => x.disabled = true);
      b2.onclick = next;
    };
  },
  order(st, body, foot) {
    const shuffled = st.items.map((x, i) => i).sort(() => Math.random() - 0.5);
    if (shuffled.every((x, i) => x === i)) shuffled.reverse();
    const placed = [];
    body.innerHTML = `<h2>${esc(st.q)}</h2><p class="txt" style="color:var(--muted)">Tap the steps in the right order. Tap a placed step to undo.</p><div class="slots" id="slots"></div><div class="pool" id="pool"></div>`;
    const btn = footBtn(foot, "Check", { disabled: true });
    function draw(result) {
      $("#slots").innerHTML = st.items.map((_, i) => `<div class="slot ${result ? (placed[i] === i ? "right" : "wrong") : ""}"><span class="n">${i + 1}</span>${placed[i] !== undefined ? `<button data-p="${i}">${esc(st.items[placed[i]])}</button>` : "Tap a step below"}</div>`).join("");
      $("#pool").innerHTML = shuffled.filter(x => !placed.includes(x)).map(x => `<button class="chip" data-x="${x}">${esc(st.items[x])}</button>`).join("");
      if (result) return;
      $("#pool").querySelectorAll(".chip").forEach(c => c.onclick = () => { placed.push(+c.dataset.x); draw(); });
      $("#slots").querySelectorAll("[data-p]").forEach(c => c.onclick = () => { placed.splice(+c.dataset.p, 1); draw(); });
      btn.disabled = placed.length !== st.items.length;
    }
    draw();
    btn.onclick = () => {
      const ok = placed.every((x, i) => x === i); L.answered++; if (ok) L.correct++;
      draw(true);
      footBtn(foot, "Continue", { cls: ok ? "teal" : "berry", fb: feedback(ok, ok ? "That's exactly how real makers work. Notice that checking comes before printing!" : "Here's the right order: " + st.items.map((s, i) => `${i + 1}. ${esc(s)}`).join(" · ")) }).onclick = next;
    };
  },
  prompt(st, body, foot) {
    const prev = S.prompt && S.prompt.text || "";
    body.innerHTML = `<div class="kicker">Your turn</div><h2>Write a design prompt</h2>
      <div class="say">${mascot("think")}<div class="sp">${st.task} Use the 5 ingredients. I'll coach you!</div></div>
      <textarea id="ptext" rows="4" maxlength="800" placeholder="Design a ...">${esc(prev)}</textarea>
      <div class="row" style="align-items:center;justify-content:space-between"><button class="btn small" id="ask">Get feedback</button>${aiStatusHtml()}</div>
      <div id="coach"></div>`;
    const btn = footBtn(foot, "Continue", { disabled: true });
    btn.onclick = next;
    $("#ask").onclick = async () => {
      const text = $("#ptext").value.trim();
      if (text.length < 3) { $("#coach").innerHTML = `<div class="fb bad"><p>Type your prompt first. Start with "Design a pencil holder..."</p></div>`; return; }
      $("#ask").disabled = true; $("#ask").textContent = "Bolt is reading...";
      $("#coach").innerHTML = `<div class="coach"><div class="say">${mascot("think")}<div class="sp">Hmm, let me look at that...</div></div></div>`;
      const r = await coachPrompt(text);
      $("#ask").disabled = false; $("#ask").textContent = "Try again";
      L.answered++; if (r.score >= 3) L.correct++;
      const best = S.prompt && S.prompt.score > r.score ? S.prompt : { text, score: r.score, improved: r.improved };
      S.prompt = best; save();
      $("#coach").innerHTML = `<div class="coach">
        <div class="score">${"★".repeat(r.score)}<span style="color:var(--locked)">${"★".repeat(5 - r.score)}</span> <span>${r.score}/5</span></div>
        <p>${esc(r.praise)}</p>
        <ul class="checks">${r.hits.map(h => `<li><span class="d ${h.ok ? "y" : "n"}">${h.ok ? "✓" : ""}</span>${esc(h.label)}</li>`).join("")}</ul>
        ${r.tips.length ? `<div><b>Try this:</b> ${r.tips.map(esc).join(" ")}</div>` : ""}
        <div><b>${r.score >= 4 ? "Another way to say it:" : "Example of a 5-star prompt:"}</b><div class="better">${esc(r.improved)}</div></div>
        <span class="aistat${r.source === "ai" ? " on" : ""}"><i></i> ${r.source === "ai" ? "Feedback from live AI" : "Feedback from offline coach"}</span>
      </div>`;
      btn.disabled = false;
    };
  },
  studio(st, body, foot) {
    let p = { ...S.design }, changes = 0;
    const suggestions = { keychain: ["make it a heart", "60 mm wide", "make it blue", "thicker", "no hole", "a star shape"], cup: ["hexagon shape", "make it taller", "80 mm wide", "thicker walls", "make it green"], stand: ["more upright", "lean back", "100 mm wide", "make it navy", "thicker"] };
    body.innerHTML = `<div class="kicker">Design studio</div><h2>Design a keychain for a friend</h2>
      <p class="txt" style="color:var(--muted)">Type a change and press Go. Make at least 3 changes. You can also ask for a <b>phone stand</b> or a <b>pencil cup</b>.</p>
      <div class="viewer" id="vw"><span class="hint">Drag to spin</span></div>
      <div class="specs" id="specs"></div>
      <div class="row"><input type="text" id="cmd" maxlength="160" placeholder="e.g. make it a 60 mm blue heart" aria-label="Describe a change"><button class="btn small" id="go">Go</button></div>
      <div class="pool" id="sugg"></div>
      <div class="log" id="log"></div>`;
    const v = makeViewer($("#vw"));
    const btn = footBtn(foot, "Make 3 changes to continue", { disabled: true });
    btn.onclick = () => { S.design = p; save(); next(); };
    function draw() {
      v.set(p);
      $("#specs").innerHTML = describe(p).map(d => `<span class="spec">${esc(d)}</span>`).join("") + `<span class="spec">≈ ${Math.max(1, Math.round(volumeMm3(p) / 1000 * 1.24 * 0.45))} g of PLA</span>`;
      $("#sugg").innerHTML = suggestions[p.type].map(s => `<button class="chip mini">${esc(s)}</button>`).join("");
      $("#sugg").querySelectorAll(".chip").forEach(c => c.onclick = () => { $("#cmd").value = c.textContent; apply(); });
    }
    function apply() {
      const text = $("#cmd").value.trim(); if (!text) return;
      const r = interpret(text, p);
      const lines = r.notes.length ? r.notes : [];
      $("#log").innerHTML = (lines.length ? `<div>Bolt understood: ${lines.map(esc).join(", ")}</div>` : `<div class="warn">Bolt didn't catch a change there. Try a size in mm, a shape, a color, "thicker", or "bigger".</div>`) + r.warns.map(w => `<div class="warn">${esc(w)}</div>`).join("");
      if (lines.length || r.warns.length) { p = r.p; changes++; S.design = p; save(); draw(); }
      $("#cmd").value = "";
      btn.disabled = changes < 3; btn.textContent = changes < 3 ? `Make ${3 - changes} more change${3 - changes > 1 ? "s" : ""}` : "Continue";
    }
    $("#go").onclick = apply;
    $("#cmd").addEventListener("keydown", e => { if (e.key === "Enter") apply(); });
    draw();
  },
  slicer(st, body, foot) {
    const p = S.design;
    let cfg = { layer: 0.2, infill: 20, supports: false };
    body.innerHTML = `<div class="kicker">Slicer settings</div><h2>Your ${p.type === "cup" ? "pencil cup" : p.type === "stand" ? "phone stand" : "keychain"} will live on a backpack. Make it strong, but don't wait all day.</h2>
      <div class="sl"><label for="ly">Layer height <span id="lyv"></span></label><input type="range" id="ly" min="0" max="2" step="1" value="1"><small style="color:var(--muted)">Thin layers look smoother but take longer.</small></div>
      <div class="sl"><label for="inf">Infill (how solid the inside is) <span id="infv"></span></label><input type="range" id="inf" min="10" max="100" step="5" value="20"><small style="color:var(--muted)">More infill is stronger, heavier and slower.</small></div>
      <label class="toggle"><input type="checkbox" id="sup"> Add supports</label>
      <div class="meters" id="meters"></div>
      <div id="sfb"></div>`;
    const LAY = [0.12, 0.2, 0.28];
    const btn = footBtn(foot, "Send to printer");
    function calc() {
      const grams = volumeMm3(p) / 1000 * 1.24 * (0.3 + 0.7 * cfg.infill / 100) * (cfg.supports ? 1.15 : 1);
      const mins = Math.round(grams * 4.2 * (0.2 / cfg.layer) + 6 + (cfg.supports ? 8 : 0));
      const strength = clamp(Math.round(30 + cfg.infill * 0.6 + (p.thick || p.wall || 3) * 2), 0, 100);
      const smooth = Math.round({ 0.12: 95, 0.2: 75, 0.28: 50 }[cfg.layer]);
      return { grams: Math.max(1, Math.round(grams)), mins, strength, smooth };
    }
    function draw() {
      $("#lyv").textContent = cfg.layer + " mm"; $("#infv").textContent = cfg.infill + "%";
      const c = calc(); L.cfg = cfg; L.calc = c;
      const fmt = m => m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} m` : `${m} min`;
      $("#meters").innerHTML = `
        <div class="meter"><small>Print time</small><b>${fmt(c.mins)}</b></div>
        <div class="meter"><small>Filament</small><b>${c.grams} g</b></div>
        <div class="meter"><small>Strength</small><b>${c.strength}</b><div class="mb"><i style="width:${c.strength}%"></i></div></div>
        <div class="meter"><small>Smoothness</small><b>${c.smooth}</b><div class="mb"><i style="width:${c.smooth}%"></i></div></div>`;
      const tip = cfg.supports ? "Your design sits flat with nothing hanging in the air, so supports just waste plastic. Try turning them off." :
        cfg.infill < 20 ? "Under 20% infill, a backpack keychain could crack when it gets bumped." :
        cfg.infill > 60 ? "Super strong, but it takes much longer and uses more filament. Somewhere around 25 to 40% is the sweet spot." :
        cfg.layer === 0.12 ? "Very smooth, but slow. For a keychain, 0.2 mm looks great and prints faster." : "Great balance of strength and speed. That's what a pro would pick!";
      const good = !cfg.supports && cfg.infill >= 20 && cfg.infill <= 60 && cfg.layer !== 0.12;
      $("#sfb").innerHTML = `<div class="say">${mascot(good ? "happy" : "think")}<div class="sp">${tip}</div></div>`;
    }
    $("#ly").oninput = e => { cfg.layer = LAY[+e.target.value]; draw(); };
    $("#inf").oninput = e => { cfg.infill = +e.target.value; draw(); };
    $("#sup").onchange = e => { cfg.supports = e.target.checked; draw(); };
    draw();
    btn.onclick = () => { const good = !cfg.supports && cfg.infill >= 20 && cfg.infill <= 60; L.answered++; if (good) L.correct++; next(); };
  },
  print(st, body, foot) {
    const p = S.design, layer = (L.cfg && L.cfg.layer) || 0.2;
    body.innerHTML = `<div class="kicker">Printing</div><h2>Watch your design print, layer by layer</h2>
      <div class="viewer" id="vw"><span class="hud" id="hud">Ready</span><span class="hint">Drag to spin</span></div>
      <div class="specs">${describe(p).map(d => `<span class="spec">${esc(d)}</span>`).join("")}<span class="spec">${layer} mm layers</span></div>
      <div class="say">${mascot("wow")}<div class="sp" id="psay">This is sped up a lot. A real print of this would take about ${L.calc ? L.calc.mins : 30} minutes.</div></div>`;
    const v = makeViewer($("#vw"), { print: true }); v.set(p);
    const btn = footBtn(foot, "Start print");
    btn.onclick = () => {
      btn.disabled = true; btn.textContent = "Printing...";
      if (!hasThree()) { btn.disabled = false; btn.textContent = "Finish lesson"; btn.onclick = next; return; }
      v.startPrint(7, layer * 4, (l, n) => { $("#hud").textContent = `Layer ${l} / ${n}`; }, () => {
        $("#hud").textContent = "Done!"; $("#psay").textContent = "It's real! You went from an idea to an object, with AI helping and you in charge.";
        btn.disabled = false; btn.className = "btn wide teal"; btn.textContent = "Finish lesson"; btn.onclick = next;
      });
    };
  }
};

function finishLesson() {
  const l = L.lesson, first = !S.done[l.id];
  const mins = Math.max(1, Math.round((Date.now() - L.t0) / 60000));
  const gained = first ? l.xp : Math.round(l.xp / 2);
  S.xp += gained; S.done[l.id] = true; S.correct += L.correct; S.answered += L.answered;
  const tk = todayKey();
  S.minutes[tk] = (S.minutes[tk] || 0) + mins;
  if (S.lastDay !== tk) { const y = todayKey(new Date(Date.now() - 864e5)); S.streak = S.lastDay === y ? S.streak + 1 : 1; S.lastDay = tk; }
  save();
  const acc = L.answered ? Math.round(L.correct / L.answered * 100) : 100;
  const allDone = LESSONS.every(x => S.done[x.id]);
  app.innerHTML = topBar(true) + `<div class="done">${mascot("wow")}
    <h2>${allDone ? "Unit complete!" : "Lesson complete!"}</h2>
    <p class="txt">${allDone ? "You earned the <b>Maker Level 1</b> badge. You can design, check, and print things with AI." : esc(l.skill) + ". Nice work!"}</p>
    <div class="stats"><div class="stat xp"><small>XP earned</small><b>+${gained}</b></div><div class="stat st"><small>Streak</small><b>${S.streak} day${S.streak === 1 ? "" : "s"}</b></div><div class="stat ac"><small>Accuracy</small><b>${acc}%</b></div></div>
    <button class="btn wide" id="cont" style="margin-top:14px">Continue</button></div>`;
  $("#cont").onclick = () => go("map");
  confetti();
}

/* ============ parent view ============ */
function renderParent() {
  const name = S.name || "Your child";
  const done = LESSONS.filter(l => S.done[l.id]);
  const days = Array.from({ length: 7 }, (_, i) => { const d = new Date(Date.now() - (6 - i) * 864e5); return { k: todayKey(d), lbl: d.toLocaleDateString(undefined, { weekday: "short" }).slice(0, 2) }; });
  const mins = days.map(d => S.minutes[d.k] || 0), maxM = Math.max(10, ...mins), weekTotal = mins.reduce((a, b) => a + b, 0);
  const acc = S.answered ? Math.round(S.correct / S.answered * 100) : null;
  const skills = LESSONS.flatMap(l => [{ s: l.skill, got: !!S.done[l.id], from: l.title }].concat(l.skill2 ? [{ s: l.skill2, got: !!S.done[l.id], from: l.title }] : []));
  app.innerHTML = topBar() + `<div class="pv">
    <div><h1>${esc(name)}'s progress</h1><p class="sub">Parent view · Unit 1: AI + 3D printing</p>
      <div class="namebox"><label for="nm" class="sub">Child's name</label><input type="text" id="nm" value="${esc(S.name)}" maxlength="24" placeholder="Name"></div></div>
    <div class="kpis">
      <div class="kpi"><small>Streak</small><b>${S.streak}</b> <span>day${S.streak === 1 ? "" : "s"}</span></div>
      <div class="kpi"><small>This week</small><b>${weekTotal}</b> <span>minutes</span></div>
      <div class="kpi"><small>Lessons</small><b>${done.length}/${LESSONS.length}</b> <span>in Unit 1</span></div>
      <div class="kpi"><small>Accuracy</small><b>${acc === null ? "–" : acc + "%"}</b> <span>first try</span></div>
    </div>
    <div class="card"><h2>Minutes learning</h2><div class="week">${days.map((d, i) => `<div><span>${mins[i] || ""}</span><i class="${mins[i] ? "" : "zero"}" style="height:${Math.round(mins[i] / maxM * 80)}%"></i>${d.lbl}</div>`).join("")}</div></div>
    <div class="card"><h2>Skills ${esc(S.name || "they've")} ${S.name ? "has" : ""} practiced</h2><ul class="skills">${skills.map(k => `<li class="${k.got ? "got" : ""}"><span class="d">${k.got ? "✓" : ""}</span><div>${esc(k.s)}<small>${esc(k.from)}</small></div></li>`).join("")}</ul></div>
    <div class="card"><h2>Their work</h2>
      ${S.prompt ? `<p class="sub">Best AI prompt (${S.prompt.score}/5 from the coach)</p><div class="quote">"${esc(S.prompt.text)}"</div>` : `<p class="sub">Their AI prompts will show up here after the "Prompt like a maker" lesson.</p>`}
      ${S.done.l4 ? `<p class="sub" style="margin-top:12px">Their latest 3D design</p><div class="viewer" id="pvw" style="aspect-ratio:16/9;margin-top:6px"><span class="hint">Drag to spin</span></div><div class="specs" style="margin-top:8px">${describe(S.design).map(d => `<span class="spec">${esc(d)}</span>`).join("")}</div>` : ""}
    </div>
    <div class="card"><h2>Talk about it at dinner</h2>${done.length ? `<ol class="starters">${done.map(l => `<li>${esc(l.talk)}</li>`).join("")}</ol>` : `<p class="sub">After each lesson we'll suggest a question to ask, so they can teach you what they learned.</p>`}</div>
    <div class="card"><h2>Why parents choose SparkLab</h2><ul class="why">
      <li><b>Five minutes a day</b>Short lessons build a habit, not a screen-time binge.</li>
      <li><b>Real skills, not just answers</b>Kids learn to direct AI, question it, and check its work.</li>
      <li><b>Safety built in</b>No chat with strangers, no ads, and lessons on privacy and trusting AI.</li>
      <li><b>From screen to real world</b>Projects end in things they can print and hold.</li></ul></div>
    <div class="row" style="flex-wrap:wrap"><button class="btn ghost small" id="demo">Load sample progress</button><button class="btn ghost small" id="reset">Reset progress</button></div>
    <p class="sub">Sample progress fills this page with example data for a demo.</p>
  </div>`;
  if (S.done.l4) makeViewer($("#pvw")).set(S.design);
  $("#nm").onchange = e => { S.name = e.target.value.trim().slice(0, 24); save(); renderParent(); };
  $("#settings").onclick = openSettings;
  $("#demo").onclick = () => {
    const m = {}; [12, 8, 0, 15, 10, 6, 9].forEach((v, i) => { m[todayKey(new Date(Date.now() - (6 - i) * 864e5))] = v; });
    S = Object.assign(fresh(), { name: S.name || "Maya", xp: 100, streak: 6, lastDay: todayKey(), done: { l1: true, l2: true, l3: true, l4: true }, correct: 12, answered: 14, minutes: m, sample: true,
      prompt: { text: "Design a hexagon pencil holder 80 mm wide and 100 mm tall for my desk, with a divider for markers. Flat bottom and 2 mm walls so it prints without supports.", score: 5 },
      design: { ...DEFAULT_DESIGN, shape: "heart", size: 55, color: "#3b7ddd" } });
    save(); renderParent();
  };
  $("#reset").onclick = function () {
    if (this.dataset.sure) { const n = S.name; S = fresh(); S.name = n; save(); renderParent(); return; }
    this.dataset.sure = 1; this.textContent = "Tap again to reset";
  };
}

/* ============ settings + onboarding ============ */
function openSettings() {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="sheet" role="dialog" aria-label="Settings"><h2>Settings</h2>
    <div><b>Live AI coach</b> ${aiStatusHtml()}<p class="sub">${sampleFn ? "Bolt is using Claude through this page. No key needed." : "SparkLab works fully offline. To try live AI feedback on prompts, paste an Anthropic API key. It stays in this browser only. For demos, use a key with a low spending limit."}</p></div>
    ${sampleFn ? "" : `<input type="password" id="key" placeholder="sk-ant-..." value="${esc(apiKey)}" autocomplete="off" aria-label="Anthropic API key">`}
    <div class="row"><button class="btn small" id="saveS">Save</button><button class="btn ghost small" id="closeS">Close</button></div></div>`;
  document.body.appendChild(m);
  const close = () => m.remove();
  m.onclick = e => { if (e.target === m) close(); };
  $("#closeS", m).onclick = close;
  $("#saveS", m).onclick = () => { const k = $("#key", m); if (k) { apiKey = k.value.trim(); store.set("sparklab_key", apiKey); } close(); refreshAiStatus(); };
}
function onboarding() {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="sheet center" role="dialog" aria-label="Welcome">${mascot("wow").replace('class="mascot"', 'class="mascot" width="110" height="110"')}
    <h2>Hi, I'm Bolt!</h2><p class="sub">I'll help you learn to design real things with AI, five minutes at a time. What should I call you?</p>
    <input type="text" id="oname" maxlength="24" placeholder="Your first name" aria-label="Your first name">
    <button class="btn wide" id="ogo">Let's go</button></div>`;
  document.body.appendChild(m);
  const goNow = () => { S.name = $("#oname", m).value.trim().slice(0, 24); save(); m.remove(); go("map"); };
  $("#ogo", m).onclick = goNow; $("#oname", m).addEventListener("keydown", e => { if (e.key === "Enter") goNow(); });
}

/* ============ confetti ============ */
function confetti() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const c = $("#confetti"), x = c.getContext("2d"); c.width = innerWidth; c.height = innerHeight;
  const cols = ["#ff7a2f", "#ffc83d", "#0fa38f", "#3b7ddd", "#f472b6"];
  const ps = Array.from({ length: 120 }, () => ({ x: Math.random() * c.width, y: -20 - Math.random() * c.height * 0.5, vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 4, r: Math.random() * 6, s: 5 + Math.random() * 6, c: cols[Math.floor(Math.random() * 5)] }));
  let n = 0;
  (function tick() {
    x.clearRect(0, 0, c.width, c.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.r += 0.1; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); });
    if (++n < 180) requestAnimationFrame(tick); else x.clearRect(0, 0, c.width, c.height);
  })();
}

go("map");
if (!S.name && !S.xp) onboarding();
</script>
